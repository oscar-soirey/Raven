[package]
name = "editor_ui"
version = "0.1.0"
edition = "2021"
description = "The interface of the Raven Bevy Editor: Raven XML (src/editor.xml) and the Rust that drives it (src/editor.rs)"

[lib]
path = "src/lib.rs"

[dependencies]
raven = { package = "raven-gui", path = "../../../bindings/rust" }
editor_core = { path = "../core" }

[[bin]]
# the editor without Bevy: the scene drawn on the CPU (to try it anywhere)
name = "raven-scene-editor-software"
path = "src/main.rs"
