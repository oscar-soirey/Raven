# Raven - builds the library on every platform, static and shared, and
# publishes the packages.
#
#   Linux   (gcc)          libraven.a            libraven.so
#   macOS   (clang)        libraven.a            libraven.dylib     (universal: arm64 + x86_64)
#   Windows (Visual C++)   raven.lib             raven.dll + raven.lib
#   Windows (MinGW-w64)    libraven.a            raven.dll + libraven.dll.a
#
# Every package is a CMake install prefix (include/, lib/, bin/ with
# raven_designer, share/raven/): find_package(raven) with CMAKE_PREFIX_PATH set to it.
#
# The tests run on Linux (headless; test_web drives the Chrome of the runner).
# A tag is released only when they pass.
#
# Each run uploads the packages as artifacts (Actions tab > the run > Artifacts).
# Pushing a tag v* (git tag v0.1.0 && git push origin v0.1.0) also attaches them
# to a GitHub Release of that tag.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VULKAN_HEADERS_TAG: v1.3.290

jobs:
  # ---------------------------------------------------------------------------
  #  Tests (Linux, headless)
  # ---------------------------------------------------------------------------
  test:
    name: tests (linux)
    runs-on: ubuntu-latest
    env:
      # the Chrome sandbox needs user namespaces, which the runner restricts
      RAVEN_WEB_NO_SANDBOX: "1"
      # ctest prints this protocol trace only when the embedding test fails.
      RAVEN_WEB_TRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRAVEN_BUILD_TESTS=ON \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=ON \
            -DRAVEN_WARNINGS_AS_ERRORS=OFF \
            -DRAVEN_VULKAN_INCLUDE_DIR="$(pwd)/_vulkan-headers/include"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

  # ---------------------------------------------------------------------------
  #  Odin (Linux): the generated package and raven_odin, with the shared library
  # ---------------------------------------------------------------------------
  odin:
    name: odin (linux)
    runs-on: ubuntu-latest
    env:
      ODIN_VERSION: dev-2026-11
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ninja-build clang

      - name: Odin (a release of odin-lang/Odin; it links with clang)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/odin.tar.gz" \
            "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz"
          mkdir "$RUNNER_TEMP/odin"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin"
          dirname "$(find "$RUNNER_TEMP/odin" -type f -name odin | head -n 1)" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          odin version
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRAVEN_BUILD_SHARED=ON \
            -DRAVEN_BUILD_TESTS=ON \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=OFF \
            -DRAVEN_WARNINGS_AS_ERRORS=OFF \
            -DRAVEN_VULKAN_INCLUDE_DIR="$(pwd)/_vulkan-headers/include"

      - name: Build
        run: cmake --build build --parallel --target raven

      # --no-tests=error: without odin the tests do not exist, which must not pass
      - name: Test
        run: ctest --test-dir build -R '^binding_odin' --no-tests=error --output-on-failure --timeout 300

  # ---------------------------------------------------------------------------
  #  D (Linux): the dub package of bindings/d, with the shared library
  # ---------------------------------------------------------------------------
  dlang:
    name: d (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ninja-build

      - name: LDC and dub
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Configure
        run: |
          ldc2 --version | head -n 1
          dub --version
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRAVEN_BUILD_SHARED=ON \
            -DRAVEN_BUILD_TESTS=ON \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=OFF \
            -DRAVEN_WARNINGS_AS_ERRORS=OFF \
            -DRAVEN_VULKAN_INCLUDE_DIR="$(pwd)/_vulkan-headers/include"

      - name: Build
        run: cmake --build build --parallel --target raven

      # --no-tests=error: without dub the test does not exist, which must not pass
      - name: Test
        run: ctest --test-dir build -R '^binding_d$' --no-tests=error --output-on-failure --timeout 600

  # ---------------------------------------------------------------------------
  #  Nim (Linux): the nimble package of bindings/nim, with the shared library
  # ---------------------------------------------------------------------------
  nim:
    name: nim (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ninja-build

      - name: Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure
        run: |
          nim --version | head -n 1
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRAVEN_BUILD_SHARED=ON \
            -DRAVEN_BUILD_TESTS=ON \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=OFF \
            -DRAVEN_WARNINGS_AS_ERRORS=OFF \
            -DRAVEN_VULKAN_INCLUDE_DIR="$(pwd)/_vulkan-headers/include"

      - name: Build
        run: cmake --build build --parallel --target raven

      # --no-tests=error: without nim the test does not exist, which must not pass
      - name: Test
        run: ctest --test-dir build -R '^binding_nim$' --no-tests=error --output-on-failure --timeout 600

  # ---------------------------------------------------------------------------
  #  Linux, macOS, Windows (Visual C++)
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }} (${{ matrix.kind }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,      os: ubuntu-latest,  kind: static, shared: "OFF" }
          - { name: linux,      os: ubuntu-latest,  kind: shared, shared: "ON"  }
          - { name: macos,      os: macos-latest,   kind: static, shared: "OFF" }
          - { name: macos,      os: macos-latest,   kind: shared, shared: "ON"  }
          - { name: windows-msvc, os: windows-latest, kind: static, shared: "OFF" }
          - { name: windows-msvc, os: windows-latest, kind: shared, shared: "ON"  }
    defaults:
      run:
        shell: bash
    env:
      PACKAGE: raven-${{ matrix.name }}-x64-${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ninja-build

      - name: Package name (macOS is universal)
        if: runner.os == 'macOS'
        run: echo "PACKAGE=raven-macos-universal-${{ matrix.kind }}" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          ROOT="$(pwd)"
          if [ "$RUNNER_OS" = "Windows" ]; then ROOT="$(pwd -W)"; fi
          EXTRA=()
          if [ "$RUNNER_OS" = "Linux" ]; then EXTRA+=(-G Ninja); fi
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0); fi
          if [ "$RUNNER_OS" = "Windows" ]; then EXTRA+=(-A x64); fi
          cmake -S . -B build "${EXTRA[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DRAVEN_BUILD_SHARED=${{ matrix.shared }} \
            -DRAVEN_BUILD_TESTS=OFF \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=ON \
            -DRAVEN_VULKAN_INCLUDE_DIR="$ROOT/_vulkan-headers/include"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix "$PACKAGE"

      - name: Archive
        run: |
          cp LICENSE NOTICE "$PACKAGE/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -E tar cf "$PACKAGE.zip" --format=zip "$PACKAGE"
          else
            tar czf "$PACKAGE.tar.gz" "$PACKAGE"
          fi
          ls -la "$PACKAGE"/lib "$PACKAGE"/bin || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.zip
            ${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error

  # The native Win32 backdrop regression needs DWM and a real window, but no GPU renderer.
  windows-backdrop:
    name: backdrop (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DRAVEN_BACKEND_VULKAN=OFF -DRAVEN_BUILD_WEB=OFF -DRAVEN_BUILD_TESTS=ON -DRAVEN_BUILD_EXAMPLES=OFF -DRAVEN_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build --config Release --target test_win32_backdrop --parallel
      - name: Test native backdrop surface
        run: ctest --test-dir build -C Release -R '^test_win32_backdrop$' --no-tests=error --output-on-failure --timeout 60

  # ---------------------------------------------------------------------------
  #  Windows (MinGW-w64, through MSYS2)
  # ---------------------------------------------------------------------------
  mingw:
    name: windows-mingw (${{ matrix.kind }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: static, shared: "OFF" }
          - { kind: shared, shared: "ON"  }
    defaults:
      run:
        shell: msys2 {0}
    env:
      PACKAGE: raven-windows-mingw-x64-${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: |
          ROOT="$(pwd -W)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DRAVEN_BUILD_SHARED=${{ matrix.shared }} \
            -DRAVEN_BUILD_TESTS=OFF \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=ON \
            -DRAVEN_VULKAN_INCLUDE_DIR="$ROOT/_vulkan-headers/include"

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build --prefix "$PACKAGE"

      - name: Archive
        run: |
          cp LICENSE NOTICE "$PACKAGE/"
          cmake -E tar cf "$PACKAGE.zip" --format=zip "$PACKAGE"
          ls -la "$PACKAGE"/lib "$PACKAGE"/bin || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  #  Raven SDK Installer: one program per platform (tools/installer/package.cmake),
  #  then an installation, a project from a template and the uninstallation with it
  # ---------------------------------------------------------------------------
  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ninja-build

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install molten-vk ninja

      - name: MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja

      - name: MinGW-w64 in the PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> "$GITHUB_PATH"

      - name: Package
        run: |
          ROOT="$(pwd)"
          if [ "$RUNNER_OS" = "Windows" ]; then ROOT="$(pwd -W)"; fi
          FAMILIES=""
          if [ "$RUNNER_OS" = "Windows" ]; then FAMILIES="-DFAMILIES=msvc;mingw"; fi
          cmake "-DVULKAN_HEADERS=$ROOT/_vulkan-headers/include" $FAMILIES -P tools/installer/package.cmake

      - name: Engine tests
        run: |
          ROOT="$(pwd)"
          if [ "$RUNNER_OS" = "Windows" ]; then ROOT="$(pwd -W)"; fi
          cmake -S . -B build-tests -DRAVEN_BUILD_INSTALLER=ON -DRAVEN_BUILD_TESTS=ON -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=OFF -DRAVEN_BUILD_WEB=OFF "-DRAVEN_VULKAN_INCLUDE_DIR=$ROOT/_vulkan-headers/include"
          cmake --build build-tests --config Release --target test_installer --parallel
          ctest --test-dir build-tests -C Release -R installer_core --output-on-failure

      - name: Install, make a project, uninstall
        run: |
          # every command in the log, and the log of the installation when one fails
          set -x
          trap 'echo "--- install.log"; cat "$RUNNER_TEMP/raven-sdk/.raven-install/install.log" 2>/dev/null || true' ERR
          if [ "$RUNNER_OS" = "macOS" ]; then
            INSTALLER="dist-installer/RavenSDKInstaller.app/Contents/MacOS/RavenSDKInstaller"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            INSTALLER="dist-installer/RavenSDKInstaller.exe"
          else
            INSTALLER="dist-installer/RavenSDKInstaller"
          fi
          "$INSTALLER" --list
          "$INSTALLER" --detect
          "$INSTALLER" --cli --yes --sdk-dir "$RUNNER_TEMP/raven-sdk" --designer-dir "$RUNNER_TEMP/raven-designer" --targets all
          NEW="$RUNNER_TEMP/raven-sdk/bin/raven-new"
          mkdir -p "$RUNNER_TEMP/project"
          "$NEW" --list
          "$NEW" --template c --dir "$RUNNER_TEMP/project"
          cmake -S "$RUNNER_TEMP/project" -B "$RUNNER_TEMP/project/build"
          cmake --build "$RUNNER_TEMP/project/build" --config Release
          "$INSTALLER" --uninstall --quiet
          test ! -e "$RUNNER_TEMP/raven-sdk/.raven-install/manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: raven-sdk-installer-${{ runner.os }}
          path: |
            dist-installer/RavenSDKInstaller.exe
            dist-installer/RavenSDKInstaller
            dist-installer/RavenSDKInstaller-macos.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  #  GitHub Release, for a tag v*
  # ---------------------------------------------------------------------------
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, mingw, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Checksums
        run: |
          cd packages
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
