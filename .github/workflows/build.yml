# Raven - builds the library on every platform, static and shared, and
# publishes the packages.
#
#   Linux   (gcc)          libraven.a            libraven.so
#   macOS   (clang)        libraven.a            libraven.dylib     (universal: arm64 + x86_64)
#   Windows (Visual C++)   raven.lib             raven.dll + raven.lib
#   Windows (MinGW-w64)    libraven.a            raven.dll + libraven.dll.a
#
# Every package is a CMake install prefix (include/, lib/, bin/ with
# raven_designer, share/raven/): find_package(raven) with CMAKE_PREFIX_PATH set to it.
#
# The tests run on Linux, macOS and Windows (Visual C++): the headless ones,
# and those of the platform of each runner (Cocoa, Win32); test_web drives the
# Chrome of the runner. A tag is released only when they pass on all three.
#
# Each run uploads the packages as artifacts (Actions tab > the run > Artifacts).
# Pushing a tag v* (git tag v0.1.0 && git push origin v0.1.0) also attaches them
# to a GitHub Release of that tag.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VULKAN_HEADERS_TAG: v1.3.290

jobs:
  # ---------------------------------------------------------------------------
  #  Tests (Linux, macOS, Windows with Visual C++)
  #
  #  The headless tests everywhere, and the tests of the platform of each
  #  runner, which has a desktop: test_cocoa_input (AppKit) on macOS,
  #  test_win32_backdrop (DWM) on Windows. The runners have no GPU for
  #  Vulkan: test_render is reported as skipped (on macOS test_render_metal
  #  renders with Metal).
  # ---------------------------------------------------------------------------
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,        os: ubuntu-latest,  pdfium: pdfium-linux-x64.tgz, pdfium_sha256: bdc60126399f39fe768566a18d4be055a7b3681bc9e248e8a6656b4f6cae0aa2, pdfium_library: lib/libpdfium.so }
          - { name: macos,        os: macos-latest,   pdfium: pdfium-mac-arm64.tgz, pdfium_sha256: 46c674298c60123f1195c2a03c65ee08c4783c84874ce4f5b3a054abb3ecaf30, pdfium_library: lib/libpdfium.dylib }
          - { name: windows-msvc, os: windows-latest, pdfium: pdfium-win-x64.tgz,   pdfium_sha256: 3452d11031050ec65e57f180215b57b9e6d465e3fbedafa8a77ad90885c7d23e, pdfium_library: bin/pdfium.dll }
    defaults:
      run:
        shell: bash
    env:
      # ctest prints this protocol trace only when the embedding test fails.
      RAVEN_WEB_TRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ninja-build
          # the Chrome sandbox needs user namespaces, which the runner restricts
          echo "RAVEN_WEB_NO_SANDBOX=1" >> "$GITHUB_ENV"

      - name: PDFium (test_pdf opens and draws documents with it; Raven itself does not need it)
        run: |
          curl -fsSL -o pdfium.tgz https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8111/${{ matrix.pdfium }}
          test "$(cmake -E sha256sum pdfium.tgz | cut -d ' ' -f 1)" = "${{ matrix.pdfium_sha256 }}"
          mkdir -p _pdfium && tar -xzf pdfium.tgz -C _pdfium
          ROOT="$(pwd)"
          if [ "$RUNNER_OS" = "Windows" ]; then ROOT="$(pwd -W)"; fi
          echo "RAVEN_PDFIUM=$ROOT/_pdfium/${{ matrix.pdfium_library }}" >> "$GITHUB_ENV"

      - name: Zig (binding_zig checks every declaration of bindings/zig/raven.zig)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          ROOT="$(pwd)"
          if [ "$RUNNER_OS" = "Windows" ]; then ROOT="$(pwd -W)"; fi
          EXTRA=()
          if [ "$RUNNER_OS" = "Linux" ]; then zig version; EXTRA+=(-G Ninja); fi
          if [ "$RUNNER_OS" = "Windows" ]; then EXTRA+=(-A x64); fi
          cmake -S . -B build "${EXTRA[@]}" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRAVEN_BUILD_TESTS=ON \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=ON \
            -DRAVEN_WARNINGS_AS_ERRORS=OFF \
            -DRAVEN_VULKAN_INCLUDE_DIR="$ROOT/_vulkan-headers/include"

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 300

  # ---------------------------------------------------------------------------
  #  Odin (Linux): the generated package and raven_odin, with the shared library
  # ---------------------------------------------------------------------------
  odin:
    name: odin (linux)
    runs-on: ubuntu-latest
    env:
      ODIN_VERSION: dev-2026-11
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ninja-build clang

      - name: Odin (a release of odin-lang/Odin; it links with clang)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/odin.tar.gz" \
            "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz"
          mkdir "$RUNNER_TEMP/odin"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin"
          dirname "$(find "$RUNNER_TEMP/odin" -type f -name odin | head -n 1)" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          odin version
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRAVEN_BUILD_SHARED=ON \
            -DRAVEN_BUILD_TESTS=ON \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=OFF \
            -DRAVEN_WARNINGS_AS_ERRORS=OFF \
            -DRAVEN_VULKAN_INCLUDE_DIR="$(pwd)/_vulkan-headers/include"

      - name: Build
        run: cmake --build build --parallel --target raven

      # --no-tests=error: without odin the tests do not exist, which must not pass
      - name: Test
        run: ctest --test-dir build -R '^binding_odin' --no-tests=error --output-on-failure --timeout 300

  # ---------------------------------------------------------------------------
  #  D (Linux): the dub package of bindings/d, with the shared library
  # ---------------------------------------------------------------------------
  dlang:
    name: d (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ninja-build

      - name: LDC and dub
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Configure
        run: |
          ldc2 --version | head -n 1
          dub --version
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRAVEN_BUILD_SHARED=ON \
            -DRAVEN_BUILD_TESTS=ON \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=OFF \
            -DRAVEN_WARNINGS_AS_ERRORS=OFF \
            -DRAVEN_VULKAN_INCLUDE_DIR="$(pwd)/_vulkan-headers/include"

      - name: Build
        run: cmake --build build --parallel --target raven

      # --no-tests=error: without dub the test does not exist, which must not pass
      - name: Test
        run: ctest --test-dir build -R '^binding_d$' --no-tests=error --output-on-failure --timeout 600

  # ---------------------------------------------------------------------------
  #  Nim (Linux): the nimble package of bindings/nim, with the shared library
  # ---------------------------------------------------------------------------
  nim:
    name: nim (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ninja-build

      - name: Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure
        run: |
          nim --version | head -n 1
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRAVEN_BUILD_SHARED=ON \
            -DRAVEN_BUILD_TESTS=ON \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=OFF \
            -DRAVEN_WARNINGS_AS_ERRORS=OFF \
            -DRAVEN_VULKAN_INCLUDE_DIR="$(pwd)/_vulkan-headers/include"

      - name: Build
        run: cmake --build build --parallel --target raven

      # --no-tests=error: without nim the test does not exist, which must not pass
      - name: Test
        run: ctest --test-dir build -R '^binding_nim$' --no-tests=error --output-on-failure --timeout 600

  # ---------------------------------------------------------------------------
  #  Swift (Linux): the package of bindings/swift, with the shared library
  #  (the runner comes with Swift)
  # ---------------------------------------------------------------------------
  swift:
    name: swift (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ninja-build

      - name: Configure
        run: |
          swift --version
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRAVEN_BUILD_SHARED=ON \
            -DRAVEN_BUILD_TESTS=ON \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=OFF \
            -DRAVEN_WARNINGS_AS_ERRORS=OFF \
            -DRAVEN_VULKAN_INCLUDE_DIR="$(pwd)/_vulkan-headers/include"

      - name: Build
        run: cmake --build build --parallel --target raven

      # --no-tests=error: without swift the test does not exist, which must not pass
      - name: Test
        run: ctest --test-dir build -R '^binding_swift$' --no-tests=error --output-on-failure --timeout 600

  # ---------------------------------------------------------------------------
  #  Haskell (Linux): the cabal package of bindings/haskell, with the shared library
  # ---------------------------------------------------------------------------
  haskell:
    name: haskell (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ninja-build

      - name: GHC and cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
          cabal-version: latest

      - name: Configure
        run: |
          ghc --version
          cabal --version
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRAVEN_BUILD_SHARED=ON \
            -DRAVEN_BUILD_TESTS=ON \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=OFF \
            -DRAVEN_WARNINGS_AS_ERRORS=OFF \
            -DRAVEN_VULKAN_INCLUDE_DIR="$(pwd)/_vulkan-headers/include"

      - name: Build
        run: cmake --build build --parallel --target raven

      # --no-tests=error: without ghc and cabal the test does not exist, which must not pass
      - name: Test
        run: ctest --test-dir build -R '^binding_haskell$' --no-tests=error --output-on-failure --timeout 900

  # ---------------------------------------------------------------------------
  #  Lua (Linux): the C module of bindings/lua with the Lua of the distribution,
  #  the oldest and the newest it has: loaded by the interpreter (binding_lua)
  #  and compiled into a program that embeds Lua (binding_lua_embedded)
  # ---------------------------------------------------------------------------
  lua:
    name: lua ${{ matrix.lua }} (linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lua: "5.1", dev: liblua5.1-0-dev }
          - { lua: "5.4", dev: liblua5.4-dev }
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ninja-build lua${{ matrix.lua }} ${{ matrix.dev }}

      - name: Configure
        run: |
          lua${{ matrix.lua }} -v
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRAVEN_BUILD_SHARED=ON \
            -DRAVEN_BUILD_TESTS=ON \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=OFF \
            -DRAVEN_WARNINGS_AS_ERRORS=OFF \
            -DRAVEN_VULKAN_INCLUDE_DIR="$(pwd)/_vulkan-headers/include"

      - name: Build
        run: cmake --build build --parallel --target raven raven_lua raven_binding_lua_host

      # both tests must exist: without them (Lua not found) the job must not pass
      - name: Test
        run: |
          ctest --test-dir build -N -R '^binding_lua' | grep -q "Total Tests: 2"
          ctest --test-dir build -R '^binding_lua' --no-tests=error --output-on-failure --timeout 300

  # ---------------------------------------------------------------------------
  #  Linux, macOS, Windows (Visual C++)
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }} (${{ matrix.kind }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,      os: ubuntu-latest,  kind: static, shared: "OFF" }
          - { name: linux,      os: ubuntu-latest,  kind: shared, shared: "ON"  }
          - { name: macos,      os: macos-latest,   kind: static, shared: "OFF" }
          - { name: macos,      os: macos-latest,   kind: shared, shared: "ON"  }
          - { name: windows-msvc, os: windows-latest, kind: static, shared: "OFF" }
          - { name: windows-msvc, os: windows-latest, kind: shared, shared: "ON"  }
    defaults:
      run:
        shell: bash
    env:
      PACKAGE: raven-${{ matrix.name }}-x64-${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ninja-build

      - name: Package name (macOS is universal)
        if: runner.os == 'macOS'
        run: echo "PACKAGE=raven-macos-universal-${{ matrix.kind }}" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          ROOT="$(pwd)"
          if [ "$RUNNER_OS" = "Windows" ]; then ROOT="$(pwd -W)"; fi
          EXTRA=()
          if [ "$RUNNER_OS" = "Linux" ]; then EXTRA+=(-G Ninja); fi
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0); fi
          if [ "$RUNNER_OS" = "Windows" ]; then EXTRA+=(-A x64); fi
          cmake -S . -B build "${EXTRA[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DRAVEN_BUILD_SHARED=${{ matrix.shared }} \
            -DRAVEN_BUILD_TESTS=OFF \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=ON \
            -DRAVEN_VULKAN_INCLUDE_DIR="$ROOT/_vulkan-headers/include"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix "$PACKAGE"

      - name: Archive
        run: |
          cp LICENSE NOTICE "$PACKAGE/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -E tar cf "$PACKAGE.zip" --format=zip "$PACKAGE"
          else
            tar czf "$PACKAGE.tar.gz" "$PACKAGE"
          fi
          ls -la "$PACKAGE"/lib "$PACKAGE"/bin || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.zip
            ${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error

  # The addon of the Node.js binding links node.lib on Windows, which CMake downloads
  # for the node of the runner; then binding_node runs its example with the DLL.
  node-windows:
    name: node (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          node --version
          cmake -S . -B build -A x64 -DRAVEN_BACKEND_VULKAN=OFF -DRAVEN_BUILD_WEB=OFF -DRAVEN_BUILD_SHARED=ON -DRAVEN_BUILD_TESTS=ON -DRAVEN_BUILD_EXAMPLES=OFF -DRAVEN_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build --config Release --target raven raven_node --parallel
      # --no-tests=error: without the addon the test does not exist, which must not pass
      - name: Test
        run: ctest --test-dir build -C Release -R '^binding_node$' --no-tests=error --output-on-failure --timeout 300

  # ---------------------------------------------------------------------------
  #  Android (NDK, arm64-v8a): Raven and the showcase APK of examples/mobile,
  #  with the SDK, NDK and JDK of the runner. Built, not run (no device).
  # ---------------------------------------------------------------------------
  android:
    name: android (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build Raven and the APK
        env:
          RAVEN_CMAKE_ARGS: -DRAVEN_WARNINGS_AS_ERRORS=ON
        run: |
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
          echo "SDK: $ANDROID_HOME  NDK: $ANDROID_NDK"
          ./examples/mobile/android/build.sh

      - name: Check the APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/apksigner" verify examples/mobile/android/raven-hello.apk
          unzip -l examples/mobile/android/raven-hello.apk > apk.txt
          cat apk.txt
          for f in lib/arm64-v8a/libravenhello.so classes.dex assets/fonts/; do grep -q "$f" apk.txt || { echo "missing from the APK: $f"; exit 1; }; done

      - uses: actions/upload-artifact@v4
        with:
          name: raven-hello-android-arm64
          path: examples/mobile/android/raven-hello.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  #  Windows (MinGW-w64, through MSYS2)
  # ---------------------------------------------------------------------------
  mingw:
    name: windows-mingw (${{ matrix.kind }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: static, shared: "OFF" }
          - { kind: shared, shared: "ON"  }
    defaults:
      run:
        shell: msys2 {0}
    env:
      PACKAGE: raven-windows-mingw-x64-${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: |
          ROOT="$(pwd -W)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DRAVEN_BUILD_SHARED=${{ matrix.shared }} \
            -DRAVEN_BUILD_TESTS=OFF \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=ON \
            -DRAVEN_VULKAN_INCLUDE_DIR="$ROOT/_vulkan-headers/include"

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build --prefix "$PACKAGE"

      - name: Archive
        run: |
          cp LICENSE NOTICE "$PACKAGE/"
          cmake -E tar cf "$PACKAGE.zip" --format=zip "$PACKAGE"
          ls -la "$PACKAGE"/lib "$PACKAGE"/bin || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  #  Raven SDK Installer: one program per platform (tools/installer/package.cmake),
  #  then an installation, a project from a template and the uninstallation with it
  # ---------------------------------------------------------------------------
  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan headers (only the headers are needed; nothing is linked)
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: _vulkan-headers

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ninja-build

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install molten-vk ninja

      - name: MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja

      - name: MinGW-w64 in the PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> "$GITHUB_PATH"

      - name: Package
        run: |
          ROOT="$(pwd)"
          if [ "$RUNNER_OS" = "Windows" ]; then ROOT="$(pwd -W)"; fi
          FAMILIES=""
          if [ "$RUNNER_OS" = "Windows" ]; then FAMILIES="-DFAMILIES=msvc;mingw"; fi
          cmake "-DVULKAN_HEADERS=$ROOT/_vulkan-headers/include" $FAMILIES -P tools/installer/package.cmake

      - name: Engine tests
        run: |
          ROOT="$(pwd)"
          if [ "$RUNNER_OS" = "Windows" ]; then ROOT="$(pwd -W)"; fi
          cmake -S . -B build-tests -DRAVEN_BUILD_INSTALLER=ON -DRAVEN_BUILD_TESTS=ON -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=OFF -DRAVEN_BUILD_WEB=OFF "-DRAVEN_VULKAN_INCLUDE_DIR=$ROOT/_vulkan-headers/include"
          cmake --build build-tests --config Release --target test_installer --parallel
          ctest --test-dir build-tests -C Release -R installer_core --output-on-failure

      - name: Install, make a project, uninstall
        run: |
          # every command in the log, and the log of the installation when one fails
          set -x
          trap 'echo "--- install.log"; cat "$RUNNER_TEMP/raven-sdk/.raven-install/install.log" 2>/dev/null || true' ERR
          if [ "$RUNNER_OS" = "macOS" ]; then
            INSTALLER="dist-installer/RavenSDKInstaller.app/Contents/MacOS/RavenSDKInstaller"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            INSTALLER="dist-installer/RavenSDKInstaller.exe"
          else
            INSTALLER="dist-installer/RavenSDKInstaller"
          fi
          "$INSTALLER" --list
          "$INSTALLER" --detect
          "$INSTALLER" --cli --yes --sdk-dir "$RUNNER_TEMP/raven-sdk" --designer-dir "$RUNNER_TEMP/raven-designer" --targets all
          NEW="$RUNNER_TEMP/raven-sdk/bin/raven-new"
          mkdir -p "$RUNNER_TEMP/project"
          "$NEW" --list
          "$NEW" --template c --dir "$RUNNER_TEMP/project"
          cmake -S "$RUNNER_TEMP/project" -B "$RUNNER_TEMP/project/build"
          cmake --build "$RUNNER_TEMP/project/build" --config Release
          "$INSTALLER" --uninstall --quiet
          test ! -e "$RUNNER_TEMP/raven-sdk/.raven-install/manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: raven-sdk-installer-${{ runner.os }}
          path: |
            dist-installer/RavenSDKInstaller.exe
            dist-installer/RavenSDKInstaller
            dist-installer/RavenSDKInstaller-macos.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  #  GitHub Release, for a tag v*
  # ---------------------------------------------------------------------------
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, mingw, installer, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Checksums
        run: |
          cd packages
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
